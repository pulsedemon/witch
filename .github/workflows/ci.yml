name: ci

on:
  push:
    branches: [chore/startup-abort-repro]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh lsof
      - name: Tool versions
        run: |
          node --version
          pnpm --version
          git --version
          node -p 'require("node:os").availableParallelism()'
      - name: Keep core files
        run: |
          mkdir "$RUNNER_TEMP/cores"
          sudo sysctl --write "kernel.core_pattern=$RUNNER_TEMP/cores/%p.%E"
      - run: pnpm install --frozen-lockfile
      - name: Abort from inside
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          ulimit -c unlimited
          node -e 'process.abort()'
      - name: Abort from outside
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          ulimit -c unlimited
          node -e 'console.log("ready"); setInterval(() => {}, 1000)' > "$RUNNER_TEMP/ready" &
          target=$!
          # shellcheck disable=SC2016
          timeout 30 bash -c 'until grep -q ready "$0"; do sleep 0.1; done' "$RUNNER_TEMP/ready"
          echo "sender $$ target $target"
          kill -ABRT "$target"
          wait "$target"
      - name: Startup loop
        if: matrix.shard != 1
        run: |
          ulimit -c unlimited
          pnpm exec vitest run test/cli/startup-abort-loop.test.ts
      - name: Report crashed processes
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          cores=("$RUNNER_TEMP"/cores/*)

          if (( ${#cores[@]} == 0 )); then
            echo "no core files"
            exit 0
          fi

          sudo apt-get install --yes --no-install-recommends gdb

          for core in "${cores[@]}"; do
            # %p.%E names each core <pid>.<executable path with ! for />
            name=${core##*/}
            executable=${name#*.}
            executable=${executable//!//}
            echo "::group::pid ${name%%.*} $executable"
            gdb --batch --ex "print \$_siginfo" --ex 'info threads' --ex 'thread apply all backtrace' --ex 'info sharedlibrary' "$executable" "$core" || true
            echo "::endgroup::"
          done

          # a crash inside a green job goes unread
          exit 1
