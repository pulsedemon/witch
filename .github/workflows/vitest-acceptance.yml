name: vitest acceptance

on: pull_request

permissions:
  contents: read

jobs:
  migration-evidence:
    name: migration evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh lsof
      - run: pnpm install --frozen-lockfile
      - name: Record source and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/vitest-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/vitest-evidence/revision.txt"
          git ls-files src test scripts package.json pnpm-lock.yaml vitest.config.ts README.md CLAUDE.md babel.config.js tsconfig.json .nvmrc | xargs sha256sum > "$RUNNER_TEMP/vitest-evidence/source.txt"
          node --version > "$RUNNER_TEMP/vitest-evidence/versions.txt"
          pnpm --version >> "$RUNNER_TEMP/vitest-evidence/versions.txt"
          git --version >> "$RUNNER_TEMP/vitest-evidence/versions.txt"
          node --import tsx --input-type=module -e 'import config from "./vitest.config.ts"; const {maxWorkers,pool,include,testTimeout,hookTimeout}=config.test; console.log(JSON.stringify({maxWorkers,pool,include,testTimeout,hookTimeout}));' > "$RUNNER_TEMP/vitest-evidence/policy.json"
      - name: Measure cold and warm suite runs
        run: |
          for sample in cold warm-1 warm-2 warm-3; do
            python3 .github/vitest-acceptance/measure.py "$RUNNER_TEMP/vitest-evidence" "$GITHUB_WORKSPACE" "hosted-$sample" pnpm test
          done
      - name: Retain migration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-cutover-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/vitest-evidence/*.json
            ${{ runner.temp }}/vitest-evidence/*.log
            ${{ runner.temp }}/vitest-evidence/*.txt
